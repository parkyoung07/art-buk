name: Approve Draft and Deploy Production

on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: 'Exact reviewed draft ID'
        required: true
        type: string
      expected_draft_sha256:
        description: 'SHA-256 of the reviewed src/content/drafts/<id>.json'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact main SHA reviewed for this approval'
        required: true
        type: string
      confirmation:
        description: 'Type APPROVE <draft_id>'
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    outputs:
      candidate_sha: ${{ steps.merge_candidate.outputs.candidate_sha }}
      live_url: ${{ steps.approve.outputs.live_url }}
      post_slug: ${{ steps.approve.outputs.post_slug }}
      approval_digest: ${{ steps.approve.outputs.approval_digest }}
    steps:
      - name: Validate approval inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DRAFT_ID: ${{ inputs.draft_id }}
          EXPECTED_DRAFT_SHA256: ${{ inputs.expected_draft_sha256 }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          APPROVAL_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$DRAFT_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm)$ ]] || exit 1
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_DRAFT_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test "$CONFIRMATION" = "APPROVE $DRAFT_ID"
          test "$APPROVAL_ACTOR" = "$REPOSITORY_OWNER"
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Verify checked-out main approval SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate explicit approval boundary
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DRAFT_ID: ${{ inputs.draft_id }}
          EXPECTED_DRAFT_SHA256: ${{ inputs.expected_draft_sha256 }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          [[ "$DRAFT_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm)$ ]] || exit 1
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$EXPECTED_DRAFT_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          test "$CONFIRMATION" = "APPROVE $DRAFT_ID"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          test "$(sha256sum "src/content/drafts/$DRAFT_ID.json" | cut -d' ' -f1)" = "$EXPECTED_DRAFT_SHA256"
          cp data/private/content-drafts.json "$RUNNER_TEMP/drafts-before.json"
      - id: approve
        name: Move exactly one reviewed draft to approved
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
          EXPECTED_DRAFT_SHA256: ${{ inputs.expected_draft_sha256 }}
          APPROVAL_ACTOR: ${{ github.actor }}
          APPROVAL_RUN_ID: ${{ github.run_id }}
        run: >-
          node scripts/approve-and-publish.mjs
          --phase=approve
          --id="$DRAFT_ID"
          --expected-sha256="$EXPECTED_DRAFT_SHA256"
          --actor="$APPROVAL_ACTOR"
          --run-id="$APPROVAL_RUN_ID"
      - name: Prove all other drafts are unchanged
        env:
          TARGET_ID: ${{ inputs.draft_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/drafts-before.json'));
          const after = JSON.parse(fs.readFileSync('data/private/content-drafts.json'));
          const clean = xs => xs.filter(x => x.id !== process.env.TARGET_ID);
          if (JSON.stringify(clean(before)) !== JSON.stringify(clean(after))) throw new Error('Non-target drafts changed');
          const target = after.find(x => x.id === process.env.TARGET_ID);
          if (!target || target.status !== 'approved') throw new Error('Target was not approved');
          NODE
      - name: Generate public derivatives and verify candidate
        run: |
          node scripts/build-search-index.js
          node scripts/build-rss.js
          npm test
          npx eslint src/hooks/useHydrated.ts src/utils/date-labels.ts src/utils/drafts.ts src/components/DailyPostHighlightSection.tsx src/components/ExhibitionSimpleCard.tsx src/components/MarketInfoCard.tsx src/components/MarketSection.tsx src/components/AiTripPlanner.tsx src/app/markets/page.tsx
          npm run build
          test ! -e out/data/content-drafts.json
      - id: commit
        name: Commit approved candidate on isolated release branch
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
          POST_SLUG: ${{ steps.approve.outputs.post_slug }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          APPROVE_BRANCH="release/approve-$DRAFT_ID-$GITHUB_RUN_ID"
          git switch -c "$APPROVE_BRANCH"
          git add "src/content/drafts/$DRAFT_ID.json" data/private/content-drafts.json "src/content/posts/$POST_SLUG.md" public/data/search-index.json public/search-index.json public/rss.xml public/feed.xml
          git commit -m "feat(content): approve $DRAFT_ID for production"
          git push --set-upstream origin "HEAD:$APPROVE_BRANCH"
          echo "approve_branch=$APPROVE_BRANCH" >> "$GITHUB_OUTPUT"
      - id: approval_pr
        name: Create approved-candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_id }}
          APPROVE_BRANCH: ${{ steps.commit.outputs.approve_branch }}
        run: |
          PR_URL="$(gh pr create --base main --head "$APPROVE_BRANCH" --title "feat(content): approve $DRAFT_ID for production" --body "Exact approved candidate for $DRAFT_ID. Production deployment remains gated by the production Environment and verified deployment workflow.")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
      - id: merge_candidate
        name: Revalidate and merge approved-candidate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.approval_pr.outputs.pr_url }}
          DRAFT_ID: ${{ inputs.draft_id }}
          POST_SLUG: ${{ steps.approve.outputs.post_slug }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          PR_JSON="$(gh pr view "$PR_URL" --json state,baseRefOid,files)"
          PR_JSON="$PR_JSON" DRAFT_ID="$DRAFT_ID" POST_SLUG="$POST_SLUG" EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" node -e "const pr=JSON.parse(process.env.PR_JSON); const got=pr.files.map(file=>file.path).sort(); const expected=['data/private/content-drafts.json','src/content/drafts/'+process.env.DRAFT_ID+'.json','src/content/posts/'+process.env.POST_SLUG+'.md','public/data/search-index.json','public/search-index.json','public/rss.xml','public/feed.xml'].sort(); if(pr.state!=='OPEN'||pr.baseRefOid!==process.env.EXPECTED_MAIN_SHA||JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('Approval PR scope mismatch: '+JSON.stringify({state:pr.state,baseRefOid:pr.baseRefOid,got}));"
          gh pr merge "$PR_URL" --squash --delete-branch
          CANDIDATE_SHA="$(gh pr view "$PR_URL" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  deploy-approved:
    needs: approve
    uses: ./.github/workflows/deploy.yml
    with:
      expected_sha: ${{ needs.approve.outputs.candidate_sha }}
      approved_draft_id: ${{ inputs.draft_id }}
      verify_path: /blog/${{ needs.approve.outputs.post_slug }}/
      expected_marker: ${{ needs.approve.outputs.post_slug }}
    secrets: inherit

  finalize:
    needs: [approve, deploy-approved]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Verify checked-out main candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.approve.outputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure main has not moved since approved deployment
        env:
          CANDIDATE_SHA: ${{ needs.approve.outputs.candidate_sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
      - name: Mark published only after verified Production response
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
          APPROVAL_DIGEST: ${{ needs.approve.outputs.approval_digest }}
          CANDIDATE_SHA: ${{ needs.approve.outputs.candidate_sha }}
          DEPLOYED_SHA: ${{ needs.deploy-approved.outputs.deployed_sha }}
          LIVE_URL: ${{ needs.approve.outputs.live_url }}
          DEPLOYMENT_ID: ${{ needs.deploy-approved.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ needs.deploy-approved.outputs.deployment_url }}
          VERIFIED_AT: ${{ needs.deploy-approved.outputs.verified_at }}
        run: |
          test "$DEPLOYED_SHA" = "$CANDIDATE_SHA"
          node scripts/approve-and-publish.mjs \
            --phase=finalize \
            --id="$DRAFT_ID" \
            --expected-sha256="$APPROVAL_DIGEST" \
            --deployed-sha="$DEPLOYED_SHA" \
            --live-url="$LIVE_URL" \
            --deployment-id="$DEPLOYMENT_ID" \
            --deployment-url="$DEPLOYMENT_URL" \
            --verified-at="$VERIFIED_AT"
      - id: finalize_commit
        name: Commit published state on isolated release branch
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FINALIZE_BRANCH="release/finalize-$DRAFT_ID-$GITHUB_RUN_ID"
          git switch -c "$FINALIZE_BRANCH"
          git add "src/content/drafts/$DRAFT_ID.json" data/private/content-drafts.json
          git commit -m "chore(content): mark $DRAFT_ID published"
          git push --set-upstream origin "HEAD:$FINALIZE_BRANCH"
          echo "finalize_branch=$FINALIZE_BRANCH" >> "$GITHUB_OUTPUT"
      - id: finalize_pr
        name: Create published-state pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_id }}
          FINALIZE_BRANCH: ${{ steps.finalize_commit.outputs.finalize_branch }}
        run: |
          PR_URL="$(gh pr create --base main --head "$FINALIZE_BRANCH" --title "chore(content): mark $DRAFT_ID published" --body "Finalize $DRAFT_ID only after the approved candidate was deployed and verified on Production.")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
      - name: Revalidate and merge published-state pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.finalize_pr.outputs.pr_url }}
          DRAFT_ID: ${{ inputs.draft_id }}
          CANDIDATE_SHA: ${{ needs.approve.outputs.candidate_sha }}
        run: |
          PR_JSON="$(gh pr view "$PR_URL" --json state,baseRefOid,files)"
          PR_JSON="$PR_JSON" DRAFT_ID="$DRAFT_ID" CANDIDATE_SHA="$CANDIDATE_SHA" node -e "const pr=JSON.parse(process.env.PR_JSON); const got=pr.files.map(file=>file.path).sort(); const expected=['data/private/content-drafts.json','src/content/drafts/'+process.env.DRAFT_ID+'.json'].sort(); if(pr.state!=='OPEN'||pr.baseRefOid!==process.env.CANDIDATE_SHA||JSON.stringify(got)!==JSON.stringify(expected)) throw new Error('Finalize PR scope mismatch: '+JSON.stringify({state:pr.state,baseRefOid:pr.baseRefOid,got}));"
          gh pr merge "$PR_URL" --squash --delete-branch
          PUBLISHED_SHA="$(gh pr view "$PR_URL" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          [[ "$PUBLISHED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PUBLISHED_SHA"

  recover-production:
    if: ${{ always() && needs.deploy-approved.result == 'success' && needs.finalize.result != 'success' }}
    needs: [approve, deploy-approved, finalize]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Restore prior Production deployment and keep draft approved
        shell: bash
        env:
          PRIOR_DEPLOYMENT_ID: ${{ needs.deploy-approved.outputs.prior_deployment_id }}
          CANDIDATE_SHA: ${{ needs.approve.outputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ "$PRIOR_DEPLOYMENT_ID" =~ ^[0-9a-f-]{36}$ ]] || exit 1
          CURRENT_MAIN_SHA=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).object.sha))")
          if [ "$CURRENT_MAIN_SHA" != "$CANDIDATE_SHA" ]; then
            echo 'Finalize push may already be on main; skipping rollback to avoid published-source/Production divergence.'
            exit 0
          fi
          curl --fail-with-body -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/art-buk/deployments/$PRIOR_DEPLOYMENT_ID/rollback" \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/rollback.json"
          node -e 'const r=require(process.argv[1]); if(r.success!==true) process.exit(1)' "$RUNNER_TEMP/rollback.json"
