name: Daily AI Draft Generation

on:
  schedule:
    - cron: '17 0 * * *' # 09:17 KST
    - cron: '17 5 * * *' # 14:17 KST
  workflow_dispatch:
    inputs:
      slot:
        description: 'am, pm, or auto'
        required: true
        default: auto
        type: choice
        options: [auto, am, pm]
  repository_dispatch:
    types: [daily_draft_trigger]

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Snapshot existing drafts and individual file hashes
        run: node scripts/assert-daily-draft-scope.mjs --snapshot="$RUNNER_TEMP/drafts-before.json"
      - name: Generate review_required draft only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SLOT_RAW: ${{ inputs.slot || github.event.client_payload.slot || 'auto' }}
        run: |
          SLOT="${SLOT_RAW:-auto}"
          case "$SLOT" in auto|am|pm) ;; *) echo 'Invalid slot.' >&2; exit 1;; esac
          if [ "$SLOT" = auto ]; then
            node scripts/generate-daily-draft.mjs
          else
            node scripts/generate-daily-draft.mjs --slot="$SLOT"
          fi
      - name: Enforce exactly one aggregate and matching individual draft change
        run: node scripts/assert-daily-draft-scope.mjs --verify="$RUNNER_TEMP/drafts-before.json"
      - name: Commit draft without triggering Production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/private/content-drafts.json src/content/drafts/
          if git diff --cached --quiet; then
            echo 'No new draft to commit.'
            exit 0
          fi
          git commit -m "chore(drafts): generate review_required draft"
          git push origin HEAD:main
