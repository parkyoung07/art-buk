name: Daily AI Post Generation & Deploy

on:
  schedule:
    # 1) [아침 발행] 매일 한국 시간(KST) 오전 07:17 (UTC 22:17) - 아침 출근길 & 하루 시작 문화 큐레이션
    - cron: '17 22 * * *'
    # 2) [저녁 발행] 매일 한국 시간(KST) 저녁 18:17 (UTC 09:17) - 저녁 퇴근길 & 주말 나들이/맛집 계획 큐레이션
    - cron: '17 9 * * *'
    # 3) [점심 보조] 매일 한국 시간(KST) 오후 12:47 (UTC 03:47) - 점심 틈새 시간대
    - cron: '47 3 * * *'
  workflow_dispatch: # GitHub 웹에서 수동으로 'Run workflow' 버튼 클릭하여 즉시 실행 가능
  repository_dispatch: # 외부 Webhook 트리거 (cron-job.org 등 외부 전문 타이머 연동)
    types: [daily_post_trigger]

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git commit & push 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Daily AI Post with Gemini & Pexels & Naver
        run: node scripts/generate-daily-post.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Build static site & search index
        run: npm run build

      - name: Commit and Push new post if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/ public/search-index.json
          if git diff --staged --quiet; then
            echo "ℹ️ 새로 생성된 글이 없거나 변경 사항이 없습니다."
          else
            git commit -m "🤖 Auto: Daily AI exhibition post generation [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            npx wrangler pages deploy out --project-name=art-buk --commit-dirty=true
          else
            echo "ℹ️ Cloudflare API Token이 없으므로 GitHub Push 연동을 통해 자동 배포됩니다."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

